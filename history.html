<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NRL Totals — Record &amp; History</title>
<style>
:root{--bg:#fafafa;--surface:#ffffff;--border:#e4e4e7;--text:#18181b;--text-muted:#6b7280;--text-subtle:#9ca3af;--green:#15803d;--green-bg:#f0fdf4;--red:#b91c1c;--red-bg:#fef2f2;--amber:#b45309;--amber-bg:#fef9c3;--blue:#1d4ed8;--radius:8px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;}
.container{max-width:760px;margin:0 auto;padding:32px 20px 80px;}
header{padding-bottom:24px;border-bottom:2px solid var(--border);margin-bottom:32px;}
h1{font-size:26px;font-weight:700;letter-spacing:-0.02em;}
.meta{font-size:13px;color:var(--text-muted);margin-top:4px;}
nav{display:flex;gap:10px;margin-top:14px;}
nav a{font-size:13px;color:var(--text-muted);text-decoration:none;padding:4px 12px;border:1px solid var(--border);border-radius:4px;}
nav a:hover{color:var(--text);border-color:var(--text-muted);}
h2{font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin:32px 0 14px;}
.season-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:32px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;}
.stat-pct{font-size:30px;font-weight:700;}
.stat-label{font-size:11px;color:var(--text-muted);margin-top:4px;text-transform:uppercase;letter-spacing:0.05em;}
.round-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px;}
.round-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.round-title{font-size:16px;font-weight:600;}
.round-date{font-size:12px;color:var(--text-muted);}
.section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);margin:12px 0 8px;}
.pick-row{display:flex;align-items:baseline;gap:10px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.pick-row:last-child{border-bottom:none;}
.pick-game{flex:1;min-width:160px;}
.pick-lean{font-size:12px;color:var(--text-muted);}
.hit{color:var(--green);font-weight:600;}
.miss{color:var(--red);font-weight:600;}
.pending{color:var(--amber);font-weight:600;}
.pass-note{color:var(--text-muted);font-style:italic;}
.multi-row{font-size:13px;margin-top:6px;line-height:1.8;}
.multi-outcome{display:inline-block;font-size:11px;font-weight:600;padding:2px 10px;border-radius:12px;margin-top:6px;}
.multi-outcome.hit{background:var(--green-bg);color:var(--green);}
.multi-outcome.miss{background:var(--red-bg);color:var(--red);}
.multi-outcome.pending{background:var(--amber-bg);color:var(--amber);}
.multi-outcome.not-tracked{background:#f4f4f5;color:var(--text-muted);}
.round-note{font-size:13px;color:var(--text-muted);font-style:italic;}
.tier-badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:10px;margin-left:4px;}
.tier-high{background:var(--green-bg);color:var(--green);}
.tier-solid{background:var(--amber-bg);color:var(--amber);}
.tier-watch{background:#fff7ed;color:#c2410c;}
.advisory-note{font-size:12px;color:var(--text-subtle);font-style:italic;margin:10px 0 4px;}
.about-box{background:#f4f4f5;border-radius:var(--radius);padding:18px 20px;margin-top:32px;}
.about-box h3{font-size:14px;font-weight:600;margin-bottom:8px;}
.about-box p{font-size:13px;color:var(--text-muted);margin-bottom:6px;}
footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--border);font-size:12px;color:var(--text-muted);}
footer a{color:var(--text-muted);}
@media(max-width:520px){.season-stats{grid-template-columns:repeat(2,1fr);}}
</root>
